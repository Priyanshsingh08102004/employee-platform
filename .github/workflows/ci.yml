name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-tests:
    name: Java - build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify
        working-directory: employee-service
        run: mvn -B verify

  dotnet-tests:
    name: .NET - build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet test
        run: dotnet test payroll-service.Tests/PayrollService.Tests.csproj --configuration Release

  smoke-test:
    name: Docker - build images and smoke test
    needs: [java-tests, dotnet-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for both services to be healthy
        run: ./scripts/health-check.sh
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish-images:
    name: Publish images to GitHub Container Registry
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner name (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push employee-service
        uses: docker/build-push-action@v6
        with:
          context: ./employee-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/employee-service:latest
            ghcr.io/${{ env.OWNER }}/employee-service:${{ github.sha }}
      - name: Push payroll-service
        uses: docker/build-push-action@v6
        with:
          context: ./payroll-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/payroll-service:latest
            ghcr.io/${{ env.OWNER }}/payroll-service:${{ github.sha }}
