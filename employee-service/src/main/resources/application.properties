server.port=8080
spring.application.name=employee-manager

# Which environment-specific file to load: application-dev.properties or application-prod.properties
spring.profiles.active=dev

spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# File upload limits (profile photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Actuator: only expose health and basic info, not every internal detail
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# The mail health check opens a real SMTP connection. With the placeholder mail host below (or
# whenever your mail server is unreachable) it reports DOWN, which makes Docker and Kubernetes
# health checks fail and stops a perfectly healthy app from starting. Optional email must never
# take the whole application "down", so it is excluded from the health status.
management.health.mail.enabled=false

# Email notifications (optional). Left off by default so the project runs with zero setup -
# approval/rejection emails are just logged to the console instead of actually sent.
# To send real emails: set app.mail.enabled=true and fill in your own SMTP details below.
# (For Gmail: create a 16-character "App Password" in your Google Account security settings
# first - your normal Gmail password will NOT work here.)
app.mail.enabled=false

# Spring Boot only creates the mail-sending bean if spring.mail.host is set at all, so this
# placeholder is here even with emails off - it's never actually connected to unless you set
# app.mail.enabled=true above. Replace the four lines below with your real provider to go live:
spring.mail.host=localhost
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your_email@gmail.com
# spring.mail.password=your_16_char_app_password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Service-to-service integration (polyglot platform) ----
# One shared secret protects calls in BOTH directions between this service and the .NET payroll
# service. The defaults below are for local development only - override them with environment
# variables (see docker-compose.yml / k8s/secret.yaml) anywhere real.
app.internal.api-key=${INTERNAL_API_KEY:dev-shared-secret}
app.payroll.base-url=${PAYROLL_BASE_URL:http://localhost:5100}