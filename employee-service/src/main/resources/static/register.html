<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Employee Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <form class="auth-card" id="registerForm" novalidate>
      <div class="auth-logo">EM</div>
      <h1>Create an account</h1>
      <p class="sub">New accounts get staff-level access (view, add, edit).</p>

      <div id="authMsg" class="auth-msg" hidden></div>

      <label>Username
        <input id="username" type="text" required autofocus autocomplete="username">
      </label>
      <label>Password
        <input id="password" type="password" required minlength="6" autocomplete="new-password">
        <span class="auth-note">At least 6 characters</span>
      </label>

      <button class="btn primary full" type="submit">Create account</button>
      <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
    </form>
  </main>
  <script src="auth.js"></script>
</body>
</html>
